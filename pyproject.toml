[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "study-rag-backend"
version = "0.1.0"
description = "Backend scaffold for a study-focused RAG project"
dependencies = ["PyMuPDF>=1.28.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
